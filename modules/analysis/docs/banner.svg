    <circle cx="28" cy="26" r="5.5" fill="#ef4444" opacity=".8"/>
    <circle cx="46" cy="26" r="5.5" fill="#eab308" opacity=".8"/>
    <circle cx="64" cy="26" r="5.5" fill="#22c55e" opacity=".8"/>
    <text x="86" y="30" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">paper-analysis-4ss.pipeline</text>
    <rect x="348" y="15" width="106" height="22" rx="11" fill="#064e3b" fill-opacity=".8" stroke="#059669" stroke-opacity=".7"/>
