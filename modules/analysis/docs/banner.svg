<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="paper-analysis-4ss">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061412"/>
      <stop offset="48%" stop-color="#0b1c22"/>
      <stop offset="100%" stop-color="#08201c"/>
