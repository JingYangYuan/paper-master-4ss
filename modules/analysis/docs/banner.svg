      <text x="68" y="36" text-anchor="middle" fill="#14b8a6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="800">3</text>
      <text x="68" y="58" text-anchor="middle" fill="#14b8a6" font-family="ui-sans-serif, system-ui, PingFang SC, sans-serif" font-size="12">执行语言</text>
      <rect x="148" y="0" width="136" height="74" rx="12" fill="#111c30" stroke="#1e2e4a" stroke-width="1"/>
      <text x="216" y="36" text-anchor="middle" fill="#38bdf8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="800">13</text>
