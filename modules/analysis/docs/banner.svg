    <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="card-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity=".4"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity=".4"/>
    </linearGradient>
    <linearGradient id="progress-bar" x1="0" y1="0" x2="1" y2="0">
