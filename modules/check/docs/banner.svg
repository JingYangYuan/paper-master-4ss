      <text x="68" y="58" text-anchor="middle" fill="#67e8f9" font-family="ui-sans-serif, system-ui, PingFang SC, sans-serif" font-size="12">审稿维度</text>
      <rect x="148" y="0" width="136" height="74" rx="12" fill="#111c30" stroke="#1e2e4a" stroke-width="1"/>
